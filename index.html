<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Pizza Comet ping pong のピザ注文フォーム">
<meta property="og:title" content="Pizza Comet ping pong">
<meta property="og:description" content="Jammo Ja!">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🍕%3C/text%3E%3C/svg%3E">
<title>ピザ注文フォーム</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--red:#d40000;--bg:#fff;--fg:#000;--mute:#595959;--line:#000;--soft:#d9d9d9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--red:#ff6b6b;--bg:#000;--fg:#fff;--mute:#a6a6a6;--line:#fff;--soft:#333}}
:root[data-theme="dark"]{--red:#ff6b6b;--bg:#000;--fg:#fff;--mute:#a6a6a6;--line:#fff;--soft:#333}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;line-height:1.9;font-size:16px;-webkit-font-smoothing:antialiased}
main{max-width:720px;margin:0 auto;padding:72px 24px 96px}
h1{font-size:clamp(36px,9vw,56px);font-weight:700;letter-spacing:.12em;line-height:1.3;margin:0 0 16px}
.lead{color:var(--mute);margin:0 0 72px;max-width:34em}
h2{font-size:20px;font-weight:700;letter-spacing:.12em;margin:0 0 8px;padding-bottom:12px;border-bottom:2px solid var(--line)}
section{margin-bottom:72px}
.pizza{padding:28px 0;border-bottom:1px solid var(--soft)}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:16px}
.name{font-size:22px;font-weight:700;letter-spacing:.08em}
.it{font-size:13px;color:var(--mute);margin-left:10px;letter-spacing:.04em}
.price{font-variant-numeric:tabular-nums;white-space:nowrap}
.desc{margin:4px 0 14px;color:var(--mute);font-size:14px;max-width:34em}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button,input,textarea{font:inherit;color:inherit}
.chip{background:transparent;border:1px solid var(--line);padding:2px 12px;font-size:13px;cursor:pointer;border-radius:999px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.add{margin-left:auto;background:var(--fg);color:var(--bg);border:1px solid var(--fg);padding:6px 20px;cursor:pointer;font-size:14px;letter-spacing:.08em;border-radius:2px}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
.tlabel{font-size:13px;color:var(--mute);margin-right:4px}
.line{display:grid;grid-template-columns:1fr auto auto;gap:6px 20px;align-items:baseline;padding:20px 0;border-bottom:1px solid var(--soft)}
.line .opt{grid-column:1 / -1;font-size:13px;color:var(--mute)}
.qty{grid-column:1 / -1;display:inline-flex;justify-self:start;align-items:center;border:1px solid var(--line);margin-top:6px}
.qty button{background:transparent;border:0;width:36px;height:36px;font-size:18px;line-height:1;cursor:pointer;color:var(--fg)}
.qty span{min-width:56px;text-align:center;font-size:15px;font-variant-numeric:tabular-nums}
.rm{background:none;border:0;padding:0 2px;font-size:24px;line-height:1;cursor:pointer;color:var(--fg)}
.empty{color:var(--mute);padding:20px 0}
.total{display:flex;justify-content:space-between;font-size:22px;font-weight:700;padding-top:20px;letter-spacing:.06em}
label.f{display:block;margin-top:24px;font-size:14px;letter-spacing:.06em}
input[type=text],input[type=tel],textarea{display:block;width:100%;margin-top:6px;padding:10px 0;border:0;border-bottom:1px solid var(--line);background:transparent;border-radius:0}
fieldset{border:0;padding:0;margin:24px 0 0}
legend{font-size:14px;letter-spacing:.06em;padding:0}
fieldset label{margin-right:24px;cursor:pointer}
.submit{width:100%;margin-top:40px;padding:16px;background:var(--fg);color:var(--bg);border:1px solid var(--fg);font-size:16px;letter-spacing:.2em;cursor:pointer;border-radius:2px}
.submit:disabled{opacity:.35;cursor:not-allowed}
.done{border:2px solid var(--line);padding:32px;margin-top:40px;display:none}
.done.on{display:block}
.done h3{margin:0 0 8px;font-size:22px;letter-spacing:.1em}
.err{color:var(--fg);font-size:14px;margin-top:12px;min-height:1.5em}
h1,h2,.name,.submit,.total,.eta,.stage{font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;font-weight:700}
h1{font-size:clamp(32px,8.5vw,52px);font-weight:700;letter-spacing:.02em}
h2{font-size:19px;letter-spacing:.14em}
.name{font-size:20px;letter-spacing:.06em}
.total{font-size:21px}
.submit{letter-spacing:.2em}
.it{letter-spacing:.04em}
.sum{margin-top:12px;color:var(--mute);font-size:14px}
.track{margin-top:28px}
.stage{font-size:30px;line-height:1.3}
.bar{position:relative;display:flex;height:14px;align-items:center;margin:22px 7px 0}
.seg{flex:1;height:3px;background:var(--soft)}
.seg i{display:block;height:100%;width:0;background:var(--fg);transition:width 1s linear}
.dot{position:absolute;top:50%;width:14px;height:14px;border-radius:50%;border:2px solid var(--fg);background:var(--bg);transform:translate(-50%,-50%)}
.dot.on{background:var(--fg)}
.labs{display:flex;margin:10px 7px 0;font-size:13px;color:var(--mute)}
.labs span{flex:1;text-align:center}
.labs span.now{color:var(--fg);font-weight:700}
.eta{font-size:18px;font-weight:700;margin-top:24px}
.phase{color:var(--mute);font-size:14px}
.notice{margin-top:16px;border:1px solid var(--line);padding:12px 16px;font-size:14px}
@media (prefers-reduced-motion:reduce){.seg i{transition:none}}
.inv{--bg:#000;--fg:#fff;--mute:#a6a6a6;--line:#fff;--soft:#333}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .inv{--bg:#fff;--fg:#000;--mute:#595959;--line:#000;--soft:#d9d9d9}}
:root[data-theme="dark"] .inv{--bg:#fff;--fg:#000;--mute:#595959;--line:#000;--soft:#d9d9d9}
.ferr{display:block;color:var(--red);font-size:13px;margin-top:4px}
input[type=text].bad,input[type=tel].bad{border-bottom-color:var(--red)}
</style>
</head>
<body>
<main>
<h1>Pizza Comet ping pong</h1>
<p class="lead">Jammo Ja!</p>

<section aria-labelledby="menu-h">
<h2 id="menu-h">メニュー</h2>
<div id="menu"></div>
</section>

<section aria-labelledby="cart-h">
<h2 id="cart-h">ご注文内容</h2>
<div id="cart" aria-live="polite"></div>
</section>

<section aria-labelledby="info-h">
<h2 id="info-h">お客様情報</h2>
<label class="f">お名前<input type="text" id="cname" autocomplete="name"></label>
<label class="f">電話番号<input type="tel" id="ctel" autocomplete="tel"><span class="ferr" id="etel"></span></label>
<fieldset><legend>お受け取り方法</legend>
<label><input type="radio" name="how" value="店頭受け取り" checked> 店頭受け取り</label>
<label><input type="radio" name="how" value="デリバリー"> デリバリー</label></fieldset>
<label class="f" id="addrWrap" hidden>お届け先住所<input type="text" id="caddr" autocomplete="street-address"><span class="ferr" id="eaddr"></span></label>
<label class="f">ご要望<textarea id="cnote" rows="2"></textarea></label>
<button class="submit" id="go" disabled>注文を確定する</button>
<div class="err" id="err" role="alert"></div>
<div class="done" id="done" role="status"><h3>ご注文ありがとうございます</h3><div id="doneBody"></div></div>
</section>
</main>

<script>
var T=function(n,p){return {n:n,p:p}};
var PIZZAS=[
{n:"マルゲリータ",i:"Margherita",p:1400,d:"トマト、モッツァレラ、バジル。ナポリの基本の一枚。",t:[T("水牛モッツァレラ",400),T("生ハム",350),T("ルッコラ",150),T("チェリートマト",150),T("バジル追加",100)]},
{n:"ペパロニピザ",i:"Pepperoni",p:1500,d:"スパイシーなサラミをたっぷりのせた定番。",t:[T("パイナップル",200),T("ハラペーニョ",150),T("はちみつ",150),T("ブラックオリーブ",150),T("エクストラチーズ",250)]},
{n:"マリナーラ",i:"Marinara",p:1200,d:"トマト、にんにく、オレガノ、オリーブオイル。チーズなし。",t:[T("アンチョビ",250),T("ケッパー",150),T("ブラックオリーブ",150),T("チェリートマト",150),T("唐辛子オイル",100)]},
{n:"ペスト・ジェノヴェーゼ",i:"Pesto alla Genovese",k:"pesto",p:1600,d:"バジルと松の実のソースに、モッツァレラを合わせて。",t:[T("ブッラータ",450),T("じゃがいも",200),T("インゲン",200),T("松の実追加",200),T("生ハム",350),T("パイナップル",200)]},
{n:"ビスマルク",i:"Bismarck",p:1700,d:"トマト、モッツァレラ、ベーコン、半熟卵をのせて焼き上げます。",t:[T("卵追加",150),T("アスパラガス",200),T("パルミジャーノ",200),T("トリュフオイル",300),T("黒胡椒",0)]},
{n:"クアトロフォルマッジ",i:"Quattro Formaggi",p:1800,d:"モッツァレラ、ゴルゴンゾーラ、パルミジャーノ、タレッジョの四種。",t:[T("はちみつ",150),T("くるみ",200),T("洋梨",250),T("トリュフオイル",300),T("黒胡椒",0)]},
{n:"ディアボラ",i:"Diavola",p:1600,d:"辛口サラミと唐辛子の、刺激的な一枚。",t:[T("ハラペーニョ",150),T("唐辛子オイル",100),T("赤玉ねぎ",150),T("ブラックオリーブ",150),T("エクストラチーズ",250)]},
{n:"カプリチョーザ",i:"Capricciosa",p:1700,d:"ハム、マッシュルーム、アーティチョーク、オリーブ。",t:[T("アーティチョーク追加",250),T("マッシュルーム追加",200),T("半熟卵",150),T("ブラックオリーブ",150)]},
{n:"ナポリ",i:"Napoli",p:1500,d:"アンチョビ、ケッパー、オレガノのトマトピザ。",t:[T("アンチョビ追加",250),T("水牛モッツァレラ",400),T("チェリートマト",150),T("唐辛子オイル",100)]},
{n:"プロシュット・エ・フンギ",i:"Prosciutto e Funghi",p:1700,d:"ハムとマッシュルームの組み合わせ。",t:[T("ルッコラ",150),T("トリュフオイル",300),T("パルミジャーノ",200),T("半熟卵",150),T("生ハム追加",350)]}
];
var cart=[],sel=PIZZAS.map(function(){return {}});
function yen(v){return "¥"+v.toLocaleString("ja-JP")}
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}

function buildMenu(){
 var m=document.getElementById("menu");
 PIZZAS.forEach(function(z,idx){
  var box=el("div","pizza");
  var h=el("div","head"),l=el("div");
  l.appendChild(el("span","name",z.n));l.appendChild(el("span","it",z.i));
  h.appendChild(l);h.appendChild(el("span","price",yen(z.p)));
  box.appendChild(h);box.appendChild(el("p","desc",z.d));
  var r=el("div","row");r.appendChild(el("span","tlabel","トッピング"));
  z.t.forEach(function(t){
   var b=el("button","chip",t.n+(t.p?" +"+t.p:""));b.type="button";b.setAttribute("aria-pressed","false");
   b.onclick=function(){var on=!sel[idx][t.n];sel[idx][t.n]=on;b.setAttribute("aria-pressed",on)};
   r.appendChild(b);
  });
  var a=el("button","add","カートに入れる");a.type="button";
  a.onclick=function(){
   var tops=PIZZAS[idx].t.filter(function(t){return sel[idx][t.n]}).map(function(t){return t.n});
   var key=idx+"|"+tops.join(",");
   var f=cart.filter(function(c){return c.key===key})[0];
   if(f)f.q++;else cart.push({key:key,idx:idx,tops:tops,q:1});
   sel[idx]={};r.querySelectorAll(".chip").forEach(function(c){c.setAttribute("aria-pressed","false")});
   renderCart();
  };
  r.appendChild(a);box.appendChild(r);m.appendChild(box);
 });
}
function lineTotal(c){
 var u=PIZZAS[c.idx].p;
 c.tops.forEach(function(n){u+=PIZZAS[c.idx].t.filter(function(t){return t.n===n})[0].p});
 return u*c.q;
}
function total(){return cart.reduce(function(s,c){return s+lineTotal(c)},0)}
function renderCart(){
 var w=document.getElementById("cart");w.textContent="";
 if(!cart.length){w.appendChild(el("div","empty","まだ何も入っていません。メニューからピザを選んでください。"))}
 cart.forEach(function(c,i){
  var d=el("div","line");
  d.appendChild(el("div","name",PIZZAS[c.idx].n));
  d.appendChild(el("div","price",yen(lineTotal(c))));
  var rm=el("button","rm","×");rm.type="button";rm.setAttribute("aria-label","削除");rm.onclick=function(){cart.splice(i,1);renderCart()};d.appendChild(rm);
  if(c.tops.length)d.appendChild(el("div","opt","トッピング："+c.tops.join("、")));
  var q=el("div","qty");
  var mi=el("button",null,"−");mi.type="button";mi.setAttribute("aria-label","数量を減らす");
  mi.onclick=function(){c.q--;if(c.q<1)cart.splice(i,1);renderCart()};
  var pl=el("button",null,"+");pl.type="button";pl.setAttribute("aria-label","数量を増やす");
  pl.onclick=function(){c.q++;renderCart()};
  q.appendChild(mi);q.appendChild(el("span",null,c.q+"枚"));q.appendChild(pl);
  d.appendChild(q);w.appendChild(d);
 });
 if(cart.length){var t=el("div","total");t.appendChild(el("span",null,"合計"));t.appendChild(el("span",null,yen(total())));w.appendChild(t)}
 document.getElementById("go").disabled=!cart.length;
}
function how(){return document.querySelector('input[name="how"]:checked').value}
document.querySelectorAll('input[name="how"]').forEach(function(r){
 r.onchange=function(){document.getElementById("addrWrap").hidden=how()!=="デリバリー"};
});
function rnd(a,b){return Math.round((a+Math.random()*(b-a))*60)*1000}
var NOTE={"準備中":"ご注文を確認し、生地と具材を用意しています。","調理中":"窯で焼き上げています。","配送中":"お届けに向かっています。"};
function tracker(delivery){
 var ph=[{k:"準備中",d:rnd(2,5)},{k:"調理中",d:rnd(8,12)}];
 if(delivery)ph.push({k:"配送中",d:rnd(10,20)});
 var n=ph.length,ends=[],acc=0,t0=Date.now();
 ph.forEach(function(p){acc+=p.d;ends.push(acc)});
 var wrap=el("div","track"),stage=el("div","stage"),bar=el("div","bar"),labs=el("div","labs");
 var fills=[],dots=[],ls=[];
 ph.forEach(function(p){
  var sg=el("div","seg"),f=document.createElement("i");
  sg.appendChild(f);bar.appendChild(sg);fills.push(f);
  ls.push(labs.appendChild(el("span",null,p.k)));
 });
 for(var k=0;k<=n;k++){var dt=el("b","dot");dt.style.left=(k/n*100)+"%";bar.appendChild(dt);dots.push(dt)}
 var eta=el("div","eta"),phase=el("div","phase");
 wrap.appendChild(stage);wrap.appendChild(bar);wrap.appendChild(labs);wrap.appendChild(eta);wrap.appendChild(phase);
 if(!delivery)wrap.appendChild(el("div","notice","完成から15分以内にお越しください。"));
 var timer;
 function tick(){
  var e=Date.now()-t0,i=0;
  while(i<n&&e>=ends[i])i++;
  var fin=i>=n;
  fills.forEach(function(f,j){
   var s0=j?ends[j-1]:0,r=Math.min(1,Math.max(0,(e-s0)/(ends[j]-s0)));
   f.style.width=(r*100)+"%";
  });
  dots.forEach(function(d,k){d.className=(k===0||e>=ends[k-1])?"dot on":"dot"});
  ls.forEach(function(l,j){l.className=(!fin&&j===i)?"now":""});
  if(fin){
   stage.textContent=delivery?"到着":"完成";
   eta.textContent=delivery?"お届けが完了しました":"完成しました";
   phase.textContent=delivery?"ご利用ありがとうございました。":"お店でお待ちしております。";
   clearInterval(timer);return;
  }
  stage.textContent=ph[i].k;
  eta.textContent=(delivery?"到着まで":"完成まで")+"あと約"+Math.max(1,Math.ceil((ends[n-1]-e)/60000))+"分";
  phase.textContent=NOTE[ph[i].k];
 }
 timer=setInterval(tick,1000);tick();
 wrap.stop=function(){clearInterval(timer)};
 return wrap;
}
function orderView(o){
 var f=document.createDocumentFragment(),b=el("div","sum");
 o.lines.forEach(function(s){b.appendChild(el("div",null,s))});
 b.appendChild(el("div",null,"合計 "+yen(o.total)+"／"+o.how));
 b.appendChild(el("div",null,o.name+" 様　"+o.tel));
 f.appendChild(b);
 if(o.special){var sp=el("div","track");sp.appendChild(el("div","stage","まもなくお届けに参ります。"));sp.appendChild(el("div","stage","お代を用意してお待ち下さい。"));f.appendChild(sp)}
 else{lastTracker=tracker(o.how==="デリバリー");f.appendChild(lastTracker)}
 return f;
}
var lastTracker=null,resetTimer=null;
function resetAll(){
 if(lastTracker)lastTracker.stop();
 document.getElementById("done").classList.remove("on");
 document.getElementById("doneBody").textContent="";
 ["cname","ctel","caddr","cnote"].forEach(function(id){document.getElementById(id).value=""});
 mark("etel","ctel",false);mark("eaddr","caddr",false);
 document.getElementById("err").textContent="";
 document.querySelector('input[name="how"][value="店頭受け取り"]').checked=true;
 document.getElementById("addrWrap").hidden=true;
 sel=PIZZAS.map(function(){return {}});
 document.querySelectorAll(".chip").forEach(function(c){c.setAttribute("aria-pressed","false")});
 cart=[];renderCart();
 window.scrollTo({top:0,behavior:"smooth"});
}
function half(v){return v.replace(/[０-９]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-65248)})}
function valTel(v){
 var d=half(v).replace(/[\s\-‐‑−－ー()（）]/g,"");
 return /^(0[789]0\d{8}|050\d{8}|0800\d{7}|0120\d{6}|(?!0[5789]0)0[1-9]\d{8})$/.test(d);
}
function valAddr(v){
 var d=half(v).trim();
 return d.length>=6&&/(都|道|府|県|市|区|町|村|郡)/.test(d)&&/[0-9一二三四五六七八九十]/.test(d);
}
function mark(eid,iid,bad){
 document.getElementById(eid).textContent=bad?"存在しない形式です":"";
 document.getElementById(iid).classList.toggle("bad",bad);
}
document.getElementById("ctel").oninput=function(){mark("etel","ctel",false)};
document.getElementById("caddr").oninput=function(){mark("eaddr","caddr",false)};
document.getElementById("go").onclick=function(){
 var err=document.getElementById("err"),n=document.getElementById("cname").value.trim(),
 t=document.getElementById("ctel").value.trim(),a=document.getElementById("caddr").value.trim();
 err.textContent="";
 if(!n){err.textContent="お名前を入力してください。";return}
 if(!t){err.textContent="電話番号を入力してください。";return}
 if(how()==="デリバリー"&&!a){err.textContent="お届け先住所を入力してください。";return}
 var badT=!valTel(t),badA=how()==="デリバリー"&&!valAddr(a);
 mark("etel","ctel",badT);mark("eaddr","caddr",badA);
 if(badT||badA)return;
 var secret=cart.some(function(c){return c.tops.indexOf("パイナップル")>-1});
 var o={name:n,tel:t,how:how(),total:total(),lines:cart.map(function(c){
  return PIZZAS[c.idx].n+(c.tops.length?"（"+c.tops.join("、")+"）":"")+" × "+c.q})};
 o.special=secret;
 cart=[];renderCart();
 var b=document.getElementById("doneBody");b.textContent="";b.appendChild(orderView(o));
 var d=document.getElementById("done");d.classList.add("on");
 d.scrollIntoView({behavior:"smooth",block:"center"});
 clearTimeout(resetTimer);
 if(!secret)resetTimer=setTimeout(resetAll,20000);
};
buildMenu();renderCart();
</script>
</body>
</html>
